<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SkillBridge – Login Mobile</title>
  <link rel="stylesheet" href="/static/css/login.css">
  <link rel="stylesheet" href="/static/css/common.css">
  <style>
    body { background: #060f1a; font-family: 'Inter', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 16px; box-sizing: border-box; }
    .card { width: 100%; max-width: 380px; background: #0d1f2f; border: 1px solid rgba(255,255,255,0.07); border-radius: 16px; padding: 32px 24px; box-shadow: 0 15px 40px rgba(0,0,0,0.5); }
    
    /* Splash Screen con lo sfondo del ponte blu richiesto */
    #splash-screen {
      position: fixed;
      inset: 0;
      background-image: url('/bg_splash.jpg');
      background-size: cover;
      background-position: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }
    #splash-screen::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(6, 15, 26, 0.82);
      z-index: 1;
    }
    #splash-screen.fade-out {
      opacity: 0;
      visibility: hidden;
    }
    .splash-logo {
      position: relative;
      z-index: 2;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: #2584ff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.25rem;
      font-weight: 800;
      color: #fff;
      box-shadow: 0 0 0 5px rgba(37,132,255,0.22), 0 0 25px rgba(37,132,255,0.6);
      animation: pulse 1.5s infinite alternate;
    }
    .splash-title {
      position: relative;
      z-index: 2;
      font-size: 1.6rem;
      font-weight: 800;
      color: #fff;
      margin-top: 18px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.08); }
    }
  </style>
</head>
<body>

  <!-- SPLASH SCREEN MOBILE (Immagine del ponte blu + Animazione 3 Secondi) -->
  <div id="splash-screen">
    <div class="splash-logo">S</div>
    <div class="splash-title">SkillBridge</div>
  </div>

  <div class="card">
    <div class="icon-wrap">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor" style="width:28px; height:28px; margin: 0 auto; display:block;"><path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V7a4.5 4.5 0 0 0-9 0v3.5M5.25 10.5h13.5A1.5 1.5 0 0 1 20.25 12v7.5A1.5 1.5 0 0 1 18.75 21H5.25A1.5 1.5 0 0 1 3.75 19.5V12A1.5 1.5 0 0 1 5.25 10.5Z"/></svg>
    </div>

    <h1 style="font-size:1.6rem; font-weight:700; text-align:center; margin-top:12px; margin-bottom:4px;">SkillBridge</h1>
    <p class="subtitle" style="text-align:center; font-size:0.85rem; color:rgba(255,255,255,0.4); margin-bottom:24px;">Effettua l'accesso da smartphone</p>

    <!-- Email -->
    <div class="input-group">
      <input id="input-username" type="text" placeholder="Email o Username" autocomplete="username" />
    </div>

    <!-- Password -->
    <div class="input-group" style="margin-top:12px;">
      <input type="password" placeholder="Password" autocomplete="current-password" />
    </div>

    <button class="btn-primary" onclick="doLogin()" style="margin-top:16px;">Accedi</button>

    <hr class="divider" style="margin:20px 0;" />

    <div class="links" style="text-align:center; font-size:0.85rem;">
      <a href="/reset-password" style="color:#2584ff; text-decoration:none; display:block; margin-bottom:8px;">Password dimenticata?</a>
      <span style="color:rgba(255,255,255,0.4);">Nuovo qui? <a href="/register" style="color:#2584ff; text-decoration:none;">Registrati ora</a></span>
    </div>
  </div>

  <script>
    // Dissolvenza automatica dello splash screen mobile impostata a 3 secondi
    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        const splash = document.getElementById('splash-screen');
        if (splash) splash.classList.add('fade-out');
      }, 3000);
    });
  </script>
  <script src="/static/js/login.js"></script>
  <script src="/static/js/pwa_init.js"></script>
</body>
</html>
