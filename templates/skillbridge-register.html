<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SkillBridge – Crea Account</title>
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#2584ff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" href="/static/icons/icon-152x152.png">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-deep:   #04111f;
      --bg-mid:    #071828;
      --card-bg:   #0d1f2f;
      --card-border: rgba(255,255,255,0.07);
      --input-bg:  #0a1929;
      --input-border: rgba(255,255,255,0.10);
      --input-border-focus: rgba(37,132,255,0.7);
      --blue:      #2584ff;
      --blue-hover:#1a72f0;
      --text-main: #ffffff;
      --text-sub:  rgba(255,255,255,0.55);
      --text-link: #4d9eff;
      --icon-bg:   rgba(255,255,255,0.10);
      --error-color: #ff5555;
      --success-color: #22c55e;
    }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse 80% 60% at 70% 50%, #0a2a4a 0%, var(--bg-deep) 60%),
                  var(--bg-deep);
      overflow-x: hidden;
      padding: 32px 16px;
    }

    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      background-size: 200px 200px;
      pointer-events: none;
      opacity: 0.35;
      z-index: 0;
    }

    .card {
      position: relative;
      z-index: 1;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 44px 44px 40px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 30px 80px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.04) inset;
      animation: fadeUp 0.45s cubic-bezier(.22,.68,0,1.2) both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px) scale(.98); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .icon-wrap {
      width: 60px; height: 60px;
      background: var(--icon-bg);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 22px;
    }
    .icon-wrap svg { width: 28px; height: 28px; stroke: #fff; }

    .card h1 {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--text-main);
      text-align: center;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }
    .card p.subtitle {
      font-size: 0.92rem;
      color: var(--text-sub);
      text-align: center;
      margin-bottom: 32px;
    }

    /* Two-column row */
    .row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 14px;
    }

    .field { margin-bottom: 14px; }
    .field label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 8px;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"],
    textarea {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 10px;
      color: var(--text-main);
      font-family: inherit;
      font-size: 0.93rem;
      padding: 13px 16px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input::placeholder, textarea::placeholder { color: var(--text-sub); }
    input:focus, textarea:focus {
      border-color: var(--input-border-focus);
      box-shadow: 0 0 0 3px rgba(37,132,255,0.12);
    }

    textarea {
      resize: vertical;
      min-height: 100px;
      line-height: 1.5;
    }

    .field-hint {
      font-size: 0.78rem;
      color: var(--text-sub);
      margin-top: 6px;
    }

    .error-message {
      color: var(--error-color);
      font-size: 0.78rem;
      margin-top: 6px;
      display: none;
    }
    .error-message.show { display: block; }

    .field.error input,
    .field.error textarea {
      border-color: var(--error-color);
      box-shadow: 0 0 0 3px rgba(255,85,85,0.12);
    }

    button.btn-primary {
      width: 100%;
      background: var(--blue);
      color: #fff;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      padding: 14px;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.18s, transform 0.12s, box-shadow 0.18s;
      box-shadow: 0 4px 20px rgba(37,132,255,0.30);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    button.btn-primary:hover:not(:disabled) {
      background: var(--blue-hover);
      box-shadow: 0 6px 28px rgba(37,132,255,0.45);
      transform: translateY(-1px);
    }
    button.btn-primary:active:not(:disabled) { transform: translateY(0); }
    button.btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-primary.loading {
      pointer-events: none;
    }

    .loader {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 1s ease-in-out infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .divider {
      border: none;
      border-top: 1px solid rgba(255,255,255,0.07);
      margin: 28px 0 20px;
    }

    .links {
      text-align: center;
      font-size: 0.88rem;
      color: var(--text-sub);
    }
    .links a {
      color: var(--text-link);
      text-decoration: none;
      transition: color 0.15s;
    }
    .links a:hover { color: #7db8ff; text-decoration: underline; }

    .toast {
      position: fixed; bottom: 32px; right: 32px;
      background: #0d1f2f;
      border: 1px solid rgba(255,255,255,0.10);
      border-radius: 14px;
      padding: 18px 22px;
      min-width: 280px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.5);
      transform: translateY(20px);
      opacity: 0;
      transition: opacity 0.3s ease, transform 0.3s ease;
      pointer-events: none;
      z-index: 999;
    }
    .toast.show { opacity: 1; transform: translateY(0); pointer-events: auto; }
    .toast-title { font-size: 0.95rem; font-weight: 700; margin-bottom: 4px; }
    .toast-body  { font-size: 0.83rem; color: var(--text-sub); }
    .toast.error {
      border-color: rgba(255,85,85,0.3);
    }
    .toast.error .toast-title { color: var(--error-color); }
    .toast.success {
      border-color: rgba(34,197,86,0.3);
    }
    .toast.success .toast-title { color: var(--success-color); }
  </style>
</head>
<body>

  <div class="card">

    <div class="icon-wrap">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
           stroke-width="1.8" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round"
              d="M18 7.5v3m0 0v3m0-3h3m-3 0h-3m-2.25-4.125a3.375 3.375 0 1 1-6.75 0 3.375 3.375 0 0 1 6.75 0ZM3 19.235v-.11a6.375 6.375 0 0 1 12.75 0v.109A12.318 12.318 0 0 1 9.374 21c-2.331 0-4.512-.645-6.374-1.766Z"/>
      </svg>
    </div>

    <h1>Crea Account</h1>
    <p class="subtitle">Unisciti alla nostra community scolastica</p>

    <form id="register-form" onsubmit="handleSubmit(event)">

      <!-- Nome + Cognome -->
      <div class="row-2">
        <div class="field">
          <label for="nome">Nome</label>
          <input type="text" id="nome" name="nome" placeholder="Es. Marco" required />
          <div class="error-message"></div>
        </div>
        <div class="field">
          <label for="cognome">Cognome</label>
          <input type="text" id="cognome" name="cognome" placeholder="Es. Rossi" required />
          <div class="error-message"></div>
        </div>
      </div>

      <!-- Email -->
      <div class="field">
        <label for="email">Email Scolastica</label>
        <input type="email" id="email" name="email" placeholder="cognome.nome@scuola.it" required />
        <div class="error-message"></div>
      </div>

      <!-- Password -->
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••••" required />
        <p class="field-hint">Minimo 6 caratteri</p>
        <div class="error-message"></div>
      </div>


      <!-- Username -->
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="Es. rossi.marco" />
        <p class="field-hint">3-30 caratteri: lettere, numeri, punto, underscore. Lascia vuoto per generarlo automaticamente.</p>
        <div class="error-message"></div>
      </div>

      <!-- Bio -->
      <div class="field">
        <label for="bio">Bio (opzionale)</label>
        <textarea id="bio" name="bio" placeholder="Quali sono i tuoi interessi? Cosa vorresti imparare o insegnare?"></textarea>
        <p class="field-hint">La tua bio sarà moderata per garantire un ambiente sicuro.</p>
        <div class="error-message"></div>
      </div>

      <button type="submit" class="btn-primary" id="btn-register">
        Registrati
      </button>

    </form>

    <hr class="divider" />

    <div class="links">
      Hai già un account? <a href="/login">Accedi</a>
    </div>

  </div>

  <!-- Toast notifiche -->
  <div class="toast" id="toast">
    <div class="toast-title">Messaggio</div>
    <div class="toast-body">Contenuto</div>
  </div>

  <script>
    const form = document.getElementById('register-form');
    const btnRegister = document.getElementById('btn-register');

    function showToast(title, body, type = 'info') {
      const toast = document.getElementById('toast');
      toast.className = `toast ${type}`;
      toast.querySelector('.toast-title').textContent = title;
      toast.querySelector('.toast-body').textContent = body;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 4000);
    }

    function clearErrors() {
      document.querySelectorAll('.field.error').forEach(f => {
        f.classList.remove('error');
        f.querySelector('.error-message').classList.remove('show');
        f.querySelector('.error-message').textContent = '';
      });
    }

    function showFieldError(fieldId, message) {
      const field = document.getElementById(fieldId).parentElement;
      field.classList.add('error');
      const errorEl = field.querySelector('.error-message');
      if (errorEl) {
        errorEl.textContent = message;
        errorEl.classList.add('show');
      }
    }

    function handleSubmit(event) {
      event.preventDefault();
      clearErrors();

      const nome = document.getElementById('nome').value.trim();
      const cognome = document.getElementById('cognome').value.trim();
      const email = document.getElementById('email').value.trim().toLowerCase();
      const password = document.getElementById('password').value;
      const bio = document.getElementById('bio').value.trim();

      // Validazioni frontend
      if (!nome || !cognome) {
        showFieldError('nome', 'Nome e cognome obbligatori');
        return;
      }

      if (!email || !email.includes('@')) {
        showFieldError('email', 'Email valida obbligatoria');
        return;
      }

      if (password.length < 6) {
        showFieldError('password', 'Password minimo 6 caratteri');
        return;
      }

      // Loading state
      btnRegister.disabled = true;
      btnRegister.classList.add('loading');
      btnRegister.innerHTML = '<div class="loader"></div> Registrazione in corso...';

      // API call
      fetch('/api/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          nome,
          cognome,
          email,
          password,
          bio,
          username
        })
      })
      .then(r => r.json())
      .then(data => {
        btnRegister.disabled = false;
        btnRegister.classList.remove('loading');
        btnRegister.textContent = 'Registrati';

        if (data.ok) {
          showToast('Successo!', data.message, 'success');
          form.reset();
          setTimeout(() => {
            window.location.href = '/login';
          }, 2000);
        } else {
          showToast('Errore', data.error || 'Errore durante la registrazione', 'error');
          
          // Se l'errore è per email, mostra nel campo
          if (data.error && data.error.toLowerCase().includes('email')) {
            showFieldError('email', data.error);
          }
        }
      })
      .catch(err => {
        btnRegister.disabled = false;
        btnRegister.classList.remove('loading');
        btnRegister.textContent = 'Registrati';
        console.error('Errore:', err);
        showToast('Errore', 'Errore di rete. Riprova.', 'error');
      });
    }

    // Enter per submit
    document.getElementById('password').addEventListener('keypress', e => {
      if (e.key === 'Enter') handleSubmit(e);
    });
  </script>
<script src="/static/js/pwa_init.js"></script>
</body>
</html>
