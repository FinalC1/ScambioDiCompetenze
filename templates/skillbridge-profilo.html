<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SkillBridge – Profilo</title>
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#2584ff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" href="/static/icons/icon-152x152.png">
  <link rel="stylesheet" href="/static/css/profilo.css">
  <link rel="stylesheet" href="/static/css/common.css">
  
</head>
<body>

<!-- SIDEBAR -->
<aside class="sidebar">
  <div class="sidebar-logo">
    <div class="avatar" id="sidebar-av">S</div>
    <span>SkillBridge</span>
  </div>
  <div class="sidebar-section">
    <div class="sidebar-section-label">Menu Principale</div>
    <a href="/dashboard" class="nav-item">
      <svg fill="none" viewBox="0 0 24 24" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.5" stroke="currentColor"/><rect x="14" y="3" width="7" height="7" rx="1.5" stroke="currentColor"/><rect x="3" y="14" width="7" height="7" rx="1.5" stroke="currentColor"/><rect x="14" y="14" width="7" height="7" rx="1.5" stroke="currentColor"/></svg>
      Dashboard
    </a>
    <a href="/cerca" class="nav-item">
      <svg fill="none" viewBox="0 0 24 24" stroke-width="1.8"><circle cx="11" cy="11" r="8" stroke="currentColor"/><path stroke-linecap="round" d="m21 21-4.35-4.35" stroke="currentColor"/></svg>
      Cerca
    </a>
    <a href="/mie-lezioni" class="nav-item">
      <svg fill="none" viewBox="0 0 24 24" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6.042A8.967 8.967 0 0 0 6 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 0 1 6 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 0 1 6-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0 0 18 18a8.967 8.967 0 0 0-6 2.292m0-14.25v14.25" stroke="currentColor"/></svg>
      Le Mie Lezioni
    </a>
    <a href="/messaggi" class="nav-item">
      <svg fill="none" viewBox="0 0 24 24" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12.76c0 1.6 1.123 2.994 2.707 3.227 1.068.157 2.148.279 3.238.364.466.037.893.281 1.153.671L12 21l2.652-3.978c.26-.39.687-.634 1.153-.67 1.09-.086 2.17-.208 3.238-.365 1.584-.233 2.707-1.626 2.707-3.228V6.741c0-1.602-1.123-2.995-2.707-3.228A48.394 48.394 0 0 0 12 3c-2.392 0-4.744.175-7.043.513C3.373 3.746 2.25 5.14 2.25 6.741v6.018Z" stroke="currentColor"/></svg>
      Messaggi
    </a>
  </div>
  <div class="sidebar-section">
    <div class="sidebar-section-label">Account</div>
    <a href="/profilo" class="nav-item active">
      <svg fill="none" viewBox="0 0 24 24" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" stroke="currentColor"/></svg>
      Profilo
    </a>
  </div>
  <div class="sidebar-spacer"></div>
  <div class="sidebar-logout">
    <a href="/logout">
      <svg fill="none" viewBox="0 0 24 24" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M8.25 9V5.25A2.25 2.25 0 0 1 10.5 3h6a2.25 2.25 0 0 1 2.25 2.25v13.5A2.25 2.25 0 0 1 16.5 21h-6a2.25 2.25 0 0 1-2.25-2.25V15m-3 0-3-3m0 0 3-3m-3 3H15" stroke="currentColor"/></svg>
      Esci
    </a>
  </div>
</aside>

<!-- MAIN -->
<main class="main">

  <!-- Profile header -->
  <div class="profile-header">
    <div class="avatar-wrap">
      <div class="avatar-placeholder" id="profile-av-big">M</div>
    </div>

    <div class="profile-info">
      <div class="profile-top">
        <h1 class="profile-name" id="profile-name">Caricamento...</h1>
        <button class="btn-edit" onclick="openEditModal()">Modifica Profilo</button>
        <button class="btn-settings" id="settingsBtn">
          <svg fill="none" viewBox="0 0 24 24" stroke-width="1.8">...</svg>
        </button>
      </div>

      <div class="stats-row">
        <div class="stat-item"><strong id="stat-lezioni">0</strong><span>Lezioni date</span></div>
        <div class="stat-item"><strong id="stat-comp">0</strong><span>Competenze</span></div>
        <div class="stat-item"><strong id="stat-rating">0</strong><span>Rating</span></div>
      </div>

      <div class="profile-tagline">
        <strong id="profile-tagline-text">Nome Cognome</strong>
      </div>
      <p class="profile-bio" id="profile-bio">Bio dell'utente</p>
    </div>
  </div>

  <!-- Tabs -->
  <div class="tabs-bar">
    <button class="ptab active" onclick="switchTab('lezioni', this)">
      <svg fill="none" viewBox="0 0 24 24" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1" stroke="currentColor"/><rect x="14" y="3" width="7" height="7" rx="1" stroke="currentColor"/><rect x="3" y="14" width="7" height="7" rx="1" stroke="currentColor"/><rect x="14" y="14" width="7" height="7" rx="1" stroke="currentColor"/></svg>
      Lezioni Create
    </button>
    <button class="ptab" onclick="switchTab('competenze', this)">
      <svg fill="none" viewBox="0 0 24 24" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6.042A8.967 8.967 0 0 0 6 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 0 1 6 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 0 1 6-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0 0 18 18a8.967 8.967 0 0 0-6 2.292m0-14.25v14.25" stroke="currentColor"/></svg>
      Competenze
    </button>
    <button class="ptab" onclick="switchTab('feedback', this)">
      <svg fill="none" viewBox="0 0 24 24" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12Z" stroke="currentColor"/></svg>
      Feedback
    </button>
  </div>

  <!-- Tab: Lezioni Create -->
  <div class="tab-panel active" id="tab-lezioni">
    <div id="lezioni-container" class="lessons-grid">
      <!-- Caricato da JS -->
    </div>
  </div>

  <!-- Tab: Competenze -->
  <div class="tab-panel" id="tab-competenze">
    <div class="comp-header">
      <h3>Le mie competenze</h3>
      <button class="btn-add" onclick="openModal()">
        <svg fill="none" viewBox="0 0 24 24" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" stroke="currentColor"/></svg>
        Aggiungi
      </button>
    </div>
    <div class="comp-grid" id="comp-grid">
      <!-- Caricato da JS -->
    </div>
  </div>

  <!-- Tab: Feedback -->
  <div class="tab-panel" id="tab-feedback">
    <div class="feedback-list" id="feedback-list">
      <!-- Caricato da JS -->
    </div>
  </div>

</main>

<!-- MODAL Modifica Profilo -->
<div class="modal-overlay" id="modal-edit-overlay" onclick="closeEditModalOutside(event)">
  <div class="modal">
    <button class="modal-close" onclick="closeEditModal()">✕</button>
    <h2>Modifica Profilo</h2>

    <div class="modal-field">
      <label for="edit-nome">Nome</label>
      <input type="text" id="edit-nome" placeholder="Nome" />
    </div>

    <div class="modal-field">
      <label for="edit-cognome">Cognome</label>
      <input type="text" id="edit-cognome" placeholder="Cognome" />
    </div>

    <div class="modal-field">
      <label for="edit-bio">Bio</label>
      <textarea id="edit-bio" placeholder="La tua bio" style="width: 100%; background: #0a1929; border: 1px solid rgba(255,255,255,0.10); border-radius: 10px; color: #fff; font-family: inherit; font-size: 0.92rem; padding: 12px 16px; outline: none; resize: vertical; min-height: 100px; line-height: 1.5;"></textarea>
    </div>

    <button class="btn-salva" onclick="saveProfile()">Salva Profilo</button>
  </div>
</div>

<!-- MODAL Nuova Competenza -->
<div class="modal-overlay" id="modal-overlay" onclick="closeModalOutside(event)">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <h2>Nuova Competenza</h2>

    <div class="modal-field">
      <label>Seleziona Materia</label>
      <select id="modal-materia">
        <option value="" disabled selected>Scegli...</option>
      </select>
    </div>

    <div class="modal-row-2">
      <div class="modal-field">
        <label>Livello</label>
        <select id="modal-livello">
          <option>Principiante</option>
          <option selected>Intermedio</option>
          <option>Avanzato</option>
          <option>Esperto</option>
        </select>
      </div>
      <div class="modal-field">
        <label>Tipo</label>
        <select id="modal-tipo">
          <option selected>Offerta</option>
          <option>Richiesta</option>
        </select>
      </div>
    </div>

    <button class="btn-salva" id="btn-save-comp" onclick="saveComp()">Salva Competenza</button>
  </div>
</div>

<style>
  @keyframes fadeUp {
    from { opacity:0; transform:translateY(14px); }
    to   { opacity:1; transform:translateY(0); }
  }
</style>

<script src="/static/js/profilo.js"></script>
<script src="/static/js/pwa_init.js"></script>
</body>
</html>
