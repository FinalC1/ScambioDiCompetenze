<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SkillBridge – Dettagli Lezione</title>
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#2584ff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" href="/static/icons/icon-152x152.png">
  <link rel="stylesheet" href="/static/css/lesson.css">
  <link rel="stylesheet" href="/static/css/common.css">

</head>
<body>

  <a href="/dashboard" class="back-link">
    <svg fill="none" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18" stroke="currentColor"/></svg>
    Torna alla dashboard
  </a>

  <div class="layout">

    <!-- LEFT -->
    <div class="left">
      <div class="badges" id="badges-container">
        <!-- Badge caricate da JS -->
      </div>

      <h1 id="lesson-title">Caricamento...</h1>
      <p class="desc" id="lesson-desc">Caricamento...</p>

      <!-- Hero -->
      <div class="hero">
        <div class="hero-placeholder"></div>
        <svg class="hero-svg" viewBox="0 0 890 390" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
          <g stroke="rgba(255,255,255,0.07)" stroke-width="1" fill="none">
            <line x1="0" y1="390" x2="445" y2="0"/>
            <line x1="890" y1="390" x2="445" y2="0"/>
            <line x1="0" y1="390" x2="890" y2="0"/>
            <line x1="890" y1="390" x2="0" y2="0"/>
            <line x1="222" y1="390" x2="445" y2="0"/>
            <line x1="668" y1="390" x2="445" y2="0"/>
            <line x1="0" y1="195" x2="890" y2="195"/>
            <line x1="0" y1="130" x2="890" y2="130"/>
            <line x1="0" y1="260" x2="890" y2="260"/>
            <line x1="0" y1="65" x2="890" y2="65"/>
          </g>
          <g stroke="rgba(255,255,255,0.06)" stroke-width="1.5" fill="none">
            <path d="M 0 390 Q 222 200 445 390"/>
            <path d="M 445 390 Q 668 200 890 390"/>
            <path d="M 0 390 Q 445 50 890 390"/>
            <path d="M 100 390 Q 445 120 780 390"/>
          </g>
          <g fill="rgba(255,255,255,0.08)">
            <circle cx="445" cy="0" r="3"/>
            <circle cx="445" cy="195" r="2.5"/>
            <circle cx="222" cy="195" r="2"/>
            <circle cx="668" cy="195" r="2"/>
          </g>
        </svg>
        <div class="hero-overlay"></div>
        <div class="hero-date">
          <span class="label">Questa lezione sarà tenuta il</span>
          <span class="value" id="hero-date">Caricamento...</span>
        </div>
      </div>

      <!-- Tabs -->
      <div class="tabs">
        <button class="tab active" onclick="switchTab('panoramica', this)">Panoramica</button>
        <button class="tab" onclick="switchTab('materiali', this)">Materiali</button>
        <button class="tab" onclick="switchTab('partecipanti', this)">Partecipanti</button>
      </div>

      <!-- Tab: Panoramica -->
      <div class="tab-panel active" id="tab-panoramica">
        <div class="learn-card">
          <h3>Cosa imparerai</h3>
          <ul class="learn-list" id="learn-list">
            <li><svg fill="none" viewBox="0 0 24 24" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" stroke="currentColor"/></svg>Caricamento...</li>
          </ul>
        </div>
      </div>

      <!-- Tab: Materiali -->
      <div class="tab-panel" id="tab-materiali">
        <div id="materiali-container">
          <!-- Materiali caricati da JS -->
        </div>
      </div>

      <!-- Tab: Partecipanti -->
      <div class="tab-panel" id="tab-partecipanti">
        <div class="learn-card">
          <h3>Partecipanti iscritti</h3>
          <div id="partecipanti-container">
            <!-- Partecipanti caricati da JS -->
          </div>
        </div>
      </div>

    </div>

    <!-- RIGHT -->
    <div class="right">
      <div class="info-card">

        <!-- Teacher -->
        <div class="teacher">
          <div class="teacher-av">
            <svg fill="none" viewBox="0 0 24 24" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" stroke="currentColor"/></svg>
          </div>
          <div>
            <div class="teacher-name" id="teacher-name">Caricamento...</div>
            <div class="teacher-role">Insegnante Verificato</div>
          </div>
        </div>

        <!-- Meta -->
        <div class="meta-row">
          <span class="meta-label">
            <svg fill="none" viewBox="0 0 24 24" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 0 1 2.25-2.25h13.5A2.25 2.25 0 0 1 21 7.5v11.25m-18 0A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75m-18 0v-7.5A2.25 2.25 0 0 1 5.25 9h13.5A2.25 2.25 0 0 1 21 11.25v7.5" stroke="currentColor"/></svg>
            Data
          </span>
          <span class="meta-value" id="meta-data">--</span>
        </div>
        <div class="meta-row">
          <span class="meta-label">
            <svg fill="none" viewBox="0 0 24 24" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" stroke="currentColor"/></svg>
            Orario
          </span>
          <span class="meta-value" id="meta-orario">--</span>
        </div>
        <div class="meta-row">
          <span class="meta-label">
            <svg fill="none" viewBox="0 0 24 24" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19.128a9.38 9.38 0 0 0 2.625.372 9.337 9.337 0 0 0 4.121-.952 4.125 4.125 0 0 0-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 0 1 8.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0 1 11.964-3.07M12 6.375a3.375 3.375 0 1 1-6.75 0 3.375 3.375 0 0 1 6.75 0Zm8.25 2.25a2.625 2.625 0 1 1-5.25 0 2.625 2.625 0 0 1 5.25 0Z" stroke="currentColor"/></svg>
            Posti
          </span>
          <span class="meta-value" id="meta-posti">--</span>
        </div>
        <div class="meta-row">
          <span class="meta-label">
            <svg fill="none" viewBox="0 0 24 24" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" stroke="currentColor"/><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1 1 15 0Z" stroke="currentColor"/></svg>
            Luogo
          </span>
          <span class="meta-value" id="meta-luogo">--</span>
        </div>

        <!-- Action area -->
        <div id="action-area"></div>
      </div>
    </div>

  </div>

  <!-- Toast -->
  <div class="toast" id="toast">
    <div class="toast-title">Successo!</div>
    <div class="toast-body">Prenotazione confermata con successo!</div>
  </div>

<script src="/static/js/lesson.js"></script>
<script src="/static/js/pwa_init.js"></script>
</body>
</html>
