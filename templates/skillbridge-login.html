<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SkillBridge – Accedi</title>
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#2584ff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" href="/static/icons/icon-152x152.png">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-deep:   #04111f;
      --bg-mid:    #071828;
      --card-bg:   #0d1f2f;
      --card-border: rgba(255,255,255,0.07);
      --input-bg:  #0a1929;
      --input-border: rgba(255,255,255,0.10);
      --input-border-focus: rgba(37,132,255,0.7);
      --blue:      #2584ff;
      --blue-hover:#1a72f0;
      --text-main: #ffffff;
      --text-sub:  rgba(255,255,255,0.55);
      --text-link: #4d9eff;
      --icon-bg:   rgba(255,255,255,0.10);
    }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse 80% 60% at 70% 50%, #0a2a4a 0%, var(--bg-deep) 60%),
                  var(--bg-deep);
      overflow: hidden;
    }

    /* subtle noise overlay */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      background-size: 200px 200px;
      pointer-events: none;
      opacity: 0.35;
      z-index: 0;
    }

    .card {
      position: relative;
      z-index: 1;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 48px 44px 44px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 30px 80px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.04) inset;
      animation: fadeUp 0.45s cubic-bezier(.22,.68,0,1.2) both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px) scale(.98); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Icon */
    .icon-wrap {
      width: 60px; height: 60px;
      background: var(--icon-bg);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 22px;
    }
    .icon-wrap svg { width: 28px; height: 28px; stroke: #fff; }

    /* Title */
    .card h1 {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--text-main);
      text-align: center;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }
    .card p.subtitle {
      font-size: 0.92rem;
      color: var(--text-sub);
      text-align: center;
      margin-bottom: 32px;
    }

    /* Inputs */
    .input-group {
      position: relative;
      margin-bottom: 14px;
    }
    .input-group svg {
      position: absolute;
      left: 16px; top: 50%; transform: translateY(-50%);
      width: 18px; height: 18px;
      stroke: var(--text-sub);
      pointer-events: none;
      transition: stroke 0.2s;
    }
    .input-group input {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 10px;
      color: var(--text-main);
      font-family: inherit;
      font-size: 0.93rem;
      padding: 14px 16px 14px 46px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .input-group input::placeholder { color: var(--text-sub); }
    .input-group input:focus {
      border-color: var(--input-border-focus);
      box-shadow: 0 0 0 3px rgba(37,132,255,0.12);
    }
    .input-group input:focus + svg,
    .input-group:focus-within svg { stroke: var(--blue); }

    /* reorder so svg comes after input for sibling selector */
    .input-group { display: flex; flex-direction: column; }
    .input-group input { order: 1; }
    .input-group .field-icon { order: 0; position: absolute; }

    /* Divider */
    .divider {
      border: none;
      border-top: 1px solid rgba(255,255,255,0.07);
      margin: 28px 0 22px;
    }

    /* Button */
    button.btn-primary {
      width: 100%;
      background: var(--blue);
      color: #fff;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      padding: 14px;
      cursor: pointer;
      margin-top: 6px;
      transition: background 0.18s, transform 0.12s, box-shadow 0.18s;
      box-shadow: 0 4px 20px rgba(37,132,255,0.30);
    }
    button.btn-primary:hover {
      background: var(--blue-hover);
      box-shadow: 0 6px 28px rgba(37,132,255,0.45);
      transform: translateY(-1px);
    }
    button.btn-primary:active { transform: translateY(0); }

    /* Links */
    .links {
      text-align: center;
      margin-top: 24px;
    }
    .links a {
      color: var(--text-link);
      text-decoration: none;
      font-size: 0.88rem;
      transition: color 0.15s;
    }
    .links a:hover { color: #7db8ff; text-decoration: underline; }
    .links .register {
      display: block;
      margin-top: 10px;
      font-size: 0.88rem;
      color: var(--text-sub);
    }
    .links .register a { color: var(--text-link); }
  </style>
</head>
<body>

  <div class="card">

    <!-- Lock icon -->
    <div class="icon-wrap">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
           stroke-width="1.8" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round"
              d="M16.5 10.5V7a4.5 4.5 0 0 0-9 0v3.5M5.25 10.5h13.5A1.5 1.5 0 0 1 20.25 12v7.5A1.5 1.5 0 0 1 18.75 21H5.25A1.5 1.5 0 0 1 3.75 19.5V12A1.5 1.5 0 0 1 5.25 10.5Z"/>
      </svg>
    </div>

    <h1>SkillBridge</h1>
    <p class="subtitle">Benvenuto, effettua l'accesso</p>

    <!-- Email -->
    <div class="input-group">
      <input id="input-username" type="text" placeholder="Email o Username" autocomplete="username" />
      <svg class="field-icon" xmlns="http://www.w3.org/2000/svg" fill="none"
           viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round"
              d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z"/>
      </svg>
    </div>

    <!-- Password -->
    <div class="input-group">
      <input type="password" placeholder="Password" autocomplete="current-password" />
      <svg class="field-icon" xmlns="http://www.w3.org/2000/svg" fill="none"
           viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round"
              d="M16.5 10.5V7a4.5 4.5 0 0 0-9 0v3.5M5.25 10.5h13.5A1.5 1.5 0 0 1 20.25 12v7.5A1.5 1.5 0 0 1 18.75 21H5.25A1.5 1.5 0 0 1 3.75 19.5V12A1.5 1.5 0 0 1 5.25 10.5Z"/>
      </svg>
    </div>

    <button class="btn-primary" onclick="doLogin()">Accedi</button>

    <hr class="divider" />

    <div class="links">
      <a href="/reset-password">Password dimenticata?</a>
      <span class="register">Nuovo qui? <a href="/register">Registrati ora</a></span>
    </div>

  </div>

  <script>
    function doLogin() {
      var email = document.getElementById("input-username").value.trim();
      var password = document.querySelector('input[type="password"]').value;
      
      if (!email || !password) { 
        alert("Inserisci email e password.");
        return; 
      }
      
      fetch('/api/login', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({email: email, password: password})
      })
      .then(r => r.json())
      .then(data => {
        if (data.ok) {
          window.location.href = '/dashboard';
        } else {
          alert('Errore: ' + (data.error || 'Login fallito'));
        }
      })
      .catch(err => {
        console.error('Errore:', err);
        alert('Errore di connessione');
      });
    }
    
    document.addEventListener("DOMContentLoaded", function(){
      document.getElementById("input-username").addEventListener("keydown", function(e){
        if (e.key === "Enter") doLogin();
      });
    });
    </script>
    <script src="/static/js/pwa_init.js"></script>
</body>
</html>
