<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SkillBridge – Accedi</title>
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#2584ff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" href="/static/icons/icon-152x152.png">
  <link rel="stylesheet" href="/static/css/login.css">
  <link rel="stylesheet" href="/static/css/common.css">
  <style>
    /* Splash Screen con Sfondo e Logo Animato */
    #splash-screen {
      position: fixed;
      inset: 0;
      /* Carica l'immagine di sfondo di SkillBridge */
      background-image: url('/bg_splash.jpg');
      background-size: cover;
      background-position: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }
    /* Filtro scuro sull'immagine per far risaltare il logo */
    #splash-screen::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(6, 15, 26, 0.82);
      z-index: 1;
    }
    #splash-screen.fade-out {
      opacity: 0;
      visibility: hidden;
    }
    .splash-logo {
      position: relative;
      z-index: 2;
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: #2584ff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.8rem;
      font-weight: 800;
      color: #fff;
      box-shadow: 0 0 0 6px rgba(37,132,255,0.22),
                  0 0 30px rgba(37,132,255,0.7);
      animation: pulse 1.5s infinite alternate;
    }
    .splash-title {
      position: relative;
      z-index: 2;
      font-size: 2rem;
      font-weight: 800;
      color: #fff;
      margin-top: 24px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.08); }
    }
  </style>
</head>
<body>

  <!-- SPLASH SCREEN (Sfondo di SkillBridge + Animazione di 3 Secondi) -->
  <div id="splash-screen">
    <div class="splash-logo">S</div>
    <div class="splash-title">SkillBridge</div>
  </div>

  <div class="card">
    <div class="icon-wrap">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
           stroke-width="1.8" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round"
              d="M16.5 10.5V7a4.5 4.5 0 0 0-9 0v3.5M5.25 10.5h13.5A1.5 1.5 0 0 1 20.25 12v7.5A1.5 1.5 0 0 1 18.75 21H5.25A1.5 1.5 0 0 1 3.75 19.5V12A1.5 1.5 0 0 1 5.25 10.5Z"/>
      </svg>
    </div>

    <h1>SkillBridge</h1>
    <p class="subtitle">Benvenuto, effettua l'accesso</p>

    <div class="input-group">
      <input id="input-username" type="text" placeholder="Email o Username" autocomplete="username" />
      <svg class="field-icon" xmlns="http://www.w3.org/2000/svg" fill="none"
           viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round"
              d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z"/>
      </svg>
    </div>

    <div class="input-group">
      <input type="password" placeholder="Password" autocomplete="current-password" />
      <svg class="field-icon" xmlns="http://www.w3.org/2000/svg" fill="none"
           viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round"
              d="M16.5 10.5V7a4.5 4.5 0 0 0-9 0v3.5M5.25 10.5h13.5A1.5 1.5 0 0 1 20.25 12v7.5A1.5 1.5 0 0 1 18.75 21H5.25A1.5 1.5 0 0 1 3.75 19.5V12A1.5 1.5 0 0 1 5.25 10.5Z"/>
      </svg>
    </div>

    <button class="btn-primary" onclick="doLogin()">Accedi</button>

    <hr class="divider" />

    <div class="links">
      <a href="/reset-password">Password dimenticata?</a>
      <span class="register">Nuovo qui? <a href="/register">Registrati ora</a></span>
    </div>
  </div>

  <script>
    // Dissolvenza automatica dello splash screen impostata a 3 secondi
    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        const splash = document.getElementById('splash-screen');
        if (splash) splash.classList.add('fade-out');
      }, 3000);
    });
  </script>
  <script src="/static/js/login.js"></script>
  <script src="/static/js/pwa_init.js"></script>
</body>
</html>
