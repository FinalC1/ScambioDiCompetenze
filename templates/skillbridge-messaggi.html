<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SkillBridge – Messaggi</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --sw: 240px; --cw: 295px;
      --bg: #060d16; --sbg: #07101a;
      --cvbg: #080e18; --chbg: #0a1520;
      --cbg: #0d1f30;
      --cb: rgba(255,255,255,0.07);
      --blue: #2584ff; --bdim: rgba(37,132,255,0.13);
      --tm: #fff; --ts: rgba(255,255,255,0.50); --tmut: rgba(255,255,255,0.28);
      --green: #22c55e;
    }
    html, body { height: 100%; overflow: hidden; }
    body {
      font-family: 'Inter', sans-serif;
      background: radial-gradient(ellipse 80% 60% at 70% 50%, #0a2a4a 0%, #060d16 60%);
      color: var(--tm); display: flex; height: 100vh;
    }

    /* ── SIDEBAR ── */
    .sidebar {
      width: var(--sw); height: 100vh; background: var(--sbg);
      border-right: 1px solid var(--cb);
      display: flex; flex-direction: column; padding: 0 0 20px; flex-shrink: 0;
    }
    .sidebar-logo { display: flex; align-items: center; gap: 11px; padding: 18px 18px 26px; }
    /* S logo — always S, blue circle with glow ring */
    .logo-s {
      width: 36px; height: 36px; border-radius: 50%;
      background: var(--blue);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.05rem; font-weight: 800; color: #fff; flex-shrink: 0;
      box-shadow: 0 0 0 2.5px rgba(37,132,255,0.28),
                  0 0 12px rgba(37,132,255,0.55),
                  0 2px 6px rgba(0,0,0,0.45);
    }
    .sidebar-logo span { font-size: 1.05rem; font-weight: 700; }
    .sidebar-sec { padding: 0 10px; margin-bottom: 22px; }
    .sec-lbl { font-size: 0.68rem; font-weight: 600; color: var(--tmut); text-transform: uppercase; letter-spacing: 0.09em; padding: 0 10px; margin-bottom: 4px; }
    .nav-item { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 9px; color: var(--ts); font-size: 0.875rem; font-weight: 500; text-decoration: none; transition: background .15s, color .15s; }
    .nav-item:hover  { background: rgba(255,255,255,.05); color: #fff; }
    .nav-item.active { background: var(--bdim); color: var(--blue); }
    .nav-item svg    { width: 17px; height: 17px; stroke: currentColor; flex-shrink: 0; }
    .sb-space { flex: 1; }
    .sb-out   { margin: 0 10px; }
    .sb-out a { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 9px; color: rgba(255,80,80,.65); font-size: .875rem; font-weight: 500; text-decoration: none; transition: background .15s, color .15s; }
    .sb-out a:hover { background: rgba(255,60,60,.08); color: #ff6060; }
    .sb-out svg { width: 17px; height: 17px; stroke: currentColor; }

    /* ── MAIN CONTENT AREA (right of sidebar) ── */
    .main-content {
      flex: 1; display: flex; align-items: center;
      padding: 20px 24px 20px 20px;
      gap: 18px; min-width: 0; overflow: hidden;
    }

    /* ── CONV PANEL ── */
    .conv-panel {
      width: var(--cw); height: calc(100vh - 40px);
      background: rgba(10,16,26,0.85);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      display: flex; flex-direction: column; flex-shrink: 0;
      overflow: hidden;
      backdrop-filter: blur(8px);
    }
    .conv-search-wrap { padding: 16px 14px 12px; }
    .conv-search { display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,.055); border: 1px solid rgba(255,255,255,.08); border-radius: 11px; padding: 9px 14px; }
    .conv-search svg   { width: 15px; height: 15px; stroke: var(--tmut); flex-shrink: 0; }
    .conv-search input { background: none; border: none; outline: none; color: var(--tm); font-family: inherit; font-size: .85rem; width: 100%; }
    .conv-search input::placeholder { color: var(--tmut); }
    .conv-list { flex: 1; overflow-y: auto; }
    .conv-list::-webkit-scrollbar { width: 3px; }
    .conv-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,.08); border-radius: 3px; }
    .conv-item { display: flex; align-items: center; gap: 11px; padding: 11px 14px; cursor: pointer; transition: background .13s; position: relative; }
    .conv-item:hover  { background: rgba(255,255,255,.035); }
    .conv-item.active { background: rgba(37,132,255,.13); }
    .conv-item.active::before { content: ''; position: absolute; left: 0; top: 8px; bottom: 8px; width: 3px; border-radius: 0 3px 3px 0; background: var(--blue); }
    .av-wrap { position: relative; flex-shrink: 0; }
    .conv-av { width: 44px; height: 44px; border-radius: 50%; overflow: hidden; }
    .conv-av svg { width: 100%; height: 100%; display: block; }
    .dot-online { position: absolute; bottom: 1px; right: 1px; width: 11px; height: 11px; border-radius: 50%; background: var(--green); border: 2px solid var(--cvbg); }
    .conv-info  { flex: 1; min-width: 0; }
    .conv-top   { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 3px; }
    .conv-name  { font-size: .875rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .conv-time  { font-size: .72rem; color: var(--tmut); flex-shrink: 0; margin-left: 6px; }
    .conv-prev  { font-size: .78rem; color: var(--ts); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* ── CHAT ── */
    .chat-area {
      flex: 1; display: flex; flex-direction: column;
      height: calc(100vh - 40px);
      background: rgba(10,18,28,0.85);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      min-width: 0; overflow: hidden;
      backdrop-filter: blur(8px);
    }
    .chat-hdr { display: flex; align-items: center; justify-content: space-between; padding: 13px 22px; border-bottom: 1px solid rgba(255,255,255,.06); background: rgba(8,16,26,.80); flex-shrink: 0; border-radius: 16px 16px 0 0; }
    .chat-hdr-l { display: flex; align-items: center; gap: 12px; }
    .hdr-av { width: 40px; height: 40px; border-radius: 50%; overflow: hidden; flex-shrink: 0; }
    .hdr-av svg { width: 100%; height: 100%; display: block; }
    .hdr-name    { font-size: .9rem; font-weight: 700; line-height: 1.2; }
    .hdr-online  { font-size: .75rem; color: var(--green); font-weight: 500; }
    .hdr-offline { font-size: .75rem; color: var(--tmut); font-weight: 500; }
    .menu-btn { background: none; border: none; color: var(--tmut); cursor: pointer; padding: 6px; border-radius: 8px; display: flex; align-items: center; transition: background .13s, color .13s; }
    .menu-btn:hover { background: rgba(255,255,255,.06); color: #fff; }
    .msgs { flex: 1; overflow-y: auto; padding: 28px 28px 16px; display: flex; flex-direction: column; gap: 14px; }
    .msgs::-webkit-scrollbar { width: 3px; }
    .msgs::-webkit-scrollbar-thumb { background: rgba(255,255,255,.07); border-radius: 3px; }
    .msg-out { align-self: flex-end; max-width: 58%; display: flex; flex-direction: column; align-items: flex-end; }
    .msg-out .bbl { background: var(--blue); color: #fff; padding: 11px 16px; border-radius: 18px 4px 18px 18px; font-size: .875rem; line-height: 1.55; box-shadow: 0 2px 14px rgba(37,132,255,.38); }
    .msg-out .ts  { font-size: .7rem; color: var(--tmut); margin-top: 4px; padding-right: 2px; }
    .msg-in  { align-self: flex-start; max-width: 58%; }
    .msg-in  .bbl { background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.08); color: var(--tm); padding: 11px 16px; border-radius: 4px 18px 18px 18px; font-size: .875rem; line-height: 1.55; }
    .msg-in  .ts  { font-size: .7rem; color: var(--tmut); margin-top: 4px; padding-left: 2px; }
    .chat-bar { padding: 12px 18px 16px; border-top: 1px solid rgba(255,255,255,.05); display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    .inp-wrap { flex: 1; display: flex; align-items: center; background: rgba(255,255,255,.055); border: 1px solid rgba(255,255,255,.09); border-radius: 26px; padding: 0 16px; transition: border-color .2s, box-shadow .2s; }
    .inp-wrap:focus-within { border-color: rgba(37,132,255,.50); box-shadow: 0 0 0 3px rgba(37,132,255,.08); }
    .inp-wrap input { flex: 1; background: none; border: none; outline: none; color: var(--tm); font-family: inherit; font-size: .875rem; padding: 13px 0; }
    .inp-wrap input::placeholder { color: var(--tmut); }
    .send-btn { width: 42px; height: 42px; border-radius: 50%; background: var(--blue); border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; box-shadow: 0 2px 10px rgba(37,132,255,.40); transition: background .15s, transform .1s; }
    .send-btn:hover  { background: #1a72f0; transform: translateY(-1px); }
    .send-btn:active { transform: translateY(0); }
    .send-btn svg    { width: 17px; height: 17px; stroke: #fff; fill: none; }
  </style>
</head>
<body>

<!-- SIDEBAR -->
<aside class="sidebar">
  <div class="sidebar-logo">
    <div class="logo-s">S</div>
    <span>SkillBridge</span>
  </div>
  <div class="sidebar-sec">
    <div class="sec-lbl">Menu Principale</div>
    <a href="/dashboard" class="nav-item">
      <svg fill="none" viewBox="0 0 24 24" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.5" stroke="currentColor"/><rect x="14" y="3" width="7" height="7" rx="1.5" stroke="currentColor"/><rect x="3" y="14" width="7" height="7" rx="1.5" stroke="currentColor"/><rect x="14" y="14" width="7" height="7" rx="1.5" stroke="currentColor"/></svg>
      Dashboard
    </a>
    <a href="/cerca" class="nav-item">
      <svg fill="none" viewBox="0 0 24 24" stroke-width="1.8"><circle cx="11" cy="11" r="8" stroke="currentColor"/><path stroke-linecap="round" d="m21 21-4.35-4.35" stroke="currentColor"/></svg>
      Cerca
    </a>
    <a href="/mie-lezioni" class="nav-item">
      <svg fill="none" viewBox="0 0 24 24" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6.042A8.967 8.967 0 0 0 6 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 0 1 6 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 0 1 6-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0 0 18 18a8.967 8.967 0 0 0-6 2.292m0-14.25v14.25" stroke="currentColor"/></svg>
      Le Mie Lezioni
    </a>
    <a href="/messaggi" class="nav-item active">
      <svg fill="none" viewBox="0 0 24 24" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12.76c0 1.6 1.123 2.994 2.707 3.227 1.068.157 2.148.279 3.238.364.466.037.893.281 1.153.671L12 21l2.652-3.978c.26-.39.687-.634 1.153-.67 1.09-.086 2.17-.208 3.238-.365 1.584-.233 2.707-1.626 2.707-3.228V6.741c0-1.602-1.123-2.995-2.707-3.228A48.394 48.394 0 0 0 12 3c-2.392 0-4.744.175-7.043.513C3.373 3.746 2.25 5.14 2.25 6.741v6.018Z" stroke="currentColor"/></svg>
      Messaggi
    </a>
  </div>
  <div class="sidebar-sec">
    <div class="sec-lbl">Account</div>
    <a href="/profilo" class="nav-item">
      <svg fill="none" viewBox="0 0 24 24" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" stroke="currentColor"/></svg>
      Profilo
    </a>
  </div>
  <div class="sb-space"></div>
  <div class="sb-out">
    <a href="/api/logout">
      <svg fill="none" viewBox="0 0 24 24" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M8.25 9V5.25A2.25 2.25 0 0 1 10.5 3h6a2.25 2.25 0 0 1 2.25 2.25v13.5A2.25 2.25 0 0 1 16.5 21h-6a2.25 2.25 0 0 1-2.25-2.25V15m-3 0-3-3m0 0 3-3m-3 3H15" stroke="currentColor"/></svg>
      Esci
    </a>
  </div>
</aside>

<!-- MAIN CONTENT -->
<div class="main-content">

<!-- CONV PANEL -->
<div class="conv-panel">
  <div class="conv-search-wrap">
    <div class="conv-search">
      <svg fill="none" viewBox="0 0 24 24" stroke-width="1.8"><circle cx="11" cy="11" r="8" stroke="currentColor"/><path stroke-linecap="round" d="m21 21-4.35-4.35" stroke="currentColor"/></svg>
      <input type="text" id="conv-search-input" placeholder="Cerca conversazione..." oninput="filterConvs(this.value)"/>
    </div>
  </div>
  <div class="conv-list" id="conv-list"></div>
</div>

<!-- CHAT -->
<div class="chat-area" id="chat-area"></div>

</div><!-- /main-content -->

<script>
  // Carica conversazioni dal backend
  window.addEventListener('load', () => {
    loadConversations();
  });
  
  function loadConversations() {
    fetch('/api/messaggi/conversazioni')
      .then(r => r.json())
      .then(data => {
        if (data.ok) {
          renderConvList(data.conversazioni);
          if (data.conversazioni.length > 0) {
            openConv(data.conversazioni[0].id_utente);
          }
        }
      })
      .catch(err => console.error('Errore:', err));
  }
  
  let activeId = null;
  let myUserId = null;
  
  function renderConvList(conversations, filter = '') {
    const el = document.getElementById('conv-list');
    const vis = conversations.filter(c => 
      c.nome.toLowerCase().includes(filter.toLowerCase())
    );
    
    el.innerHTML = vis.map(c => {
      const last = c.ultimo_messaggio || {};
      const prev = last.contenuto ? (last.mittente_id === myUserId ? 'Tu: ' : '') + last.contenuto : '';
      
      return `<div class="conv-item${c.id_utente === activeId ? ' active' : ''}" onclick="openConv('${c.id_utente}')">
        <div class="av-wrap">
          <div class="conv-av">
            <svg viewBox="0 0 44 44" xmlns="http://www.w3.org/2000/svg">
              <circle cx="22" cy="22" r="22" fill="#0f2a3f"/>
              <text x="22" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#fff">
                ${c.nome.charAt(0).toUpperCase()}
              </text>
            </svg>
          </div>
          ${c.online ? '<div class="dot-online"></div>' : ''}
        </div>
        <div class="conv-info">
          <div class="conv-top">
            <span class="conv-name">${c.nome}</span>
            <span class="conv-time">${last.data_invio ? last.data_invio.substring(0, 5) : ''}</span>
          </div>
          <div class="conv-prev">${prev.substring(0, 40)}${prev.length > 40 ? '...' : ''}</div>
        </div>
      </div>`;
    }).join('');
  }
  
  function filterConvs(v) {
    fetch('/api/messaggi/conversazioni')
      .then(r => r.json())
      .then(data => {
        if (data.ok) renderConvList(data.conversazioni, v);
      });
  }
  
  function renderChat(userId) {
    fetch(`/api/messaggi/chat/${userId}`)
      .then(r => r.json())
      .then(data => {
        if (data.ok) {
          myUserId = data.my_user_id;
          const conv = data.conversazione;
          
          document.getElementById('chat-area').innerHTML = `
            <div class="chat-hdr">
              <div class="chat-hdr-l">
                <div class="hdr-av">
                  <svg viewBox="0 0 44 44" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="22" cy="22" r="22" fill="#0f2a3f"/>
                    <text x="22" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#fff">
                      ${conv.nome.charAt(0).toUpperCase()}
                    </text>
                  </svg>
                </div>
                <div>
                  <div class="hdr-name">${conv.nome}</div>
                  <div class="${conv.online ? 'hdr-online' : 'hdr-offline'}">
                    ${conv.online ? 'Online' : 'Offline'}
                  </div>
                </div>
              </div>
              <button class="menu-btn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                  <circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/>
                </svg>
              </button>
            </div>
            <div class="msgs" id="chat-msgs">
              ${data.messaggi.map(m => `
                <div class="${m.mittente_id === data.my_user_id ? 'msg-out' : 'msg-in'}">
                  <div class="bbl">${m.contenuto}</div>
                  <div class="ts">${m.data_invio.substring(11, 16)}</div>
                </div>
              `).join('')}
            </div>
            <div class="chat-bar">
              <div class="inp-wrap">
                <input type="text" id="chat-input" placeholder="Scrivi un messaggio..."
                  onkeydown="if(event.key==='Enter')sendMsg('${userId}')"/>
              </div>
              <button class="send-btn" onclick="sendMsg('${userId}')">
                <svg viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M6 12 3.269 3.125A59.769 59.769 0 0 1 21.485 12 59.768 59.768 0 0 1 3.27 20.875L5.999 12Zm0 0h7.5"/>
                </svg>
              </button>
            </div>
          `;
          
          const m = document.getElementById('chat-msgs');
          if (m) m.scrollTop = m.scrollHeight;
        }
      });
  }
  
  function sendMsg(userId) {
    const inp = document.getElementById('chat-input');
    const txt = inp.value.trim();
    if (!txt) return;
    
    fetch(`/api/messaggi/invia`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({id_destinatario: userId, contenuto: txt})
    })
    .then(r => r.json())
    .then(data => {
      if (data.ok) {
        inp.value = '';
        renderChat(userId);
        loadConversations();
      }
    });
  }
  
  function openConv(id) {
    activeId = id;
    renderChat(id);
  }
  
  document.addEventListener('DOMContentLoaded', () => {
    loadConversations();
  });
  </script>
</body>
</html>
