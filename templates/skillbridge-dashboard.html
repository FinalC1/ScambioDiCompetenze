<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SkillBridge – Dashboard</title>
  <link rel="manifest" href="/static/manifest.json">
  <meta name="theme-color" content="#2584ff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="apple-touch-icon" href="/static/icons/icon-152x152.png">
  <link rel="stylesheet" href="/static/css/dashboard.css">
  <link rel="stylesheet" href="/static/css/common.css">

</head>
<body>

<!-- SIDEBAR -->
<aside class="sidebar">
  <div class="sidebar-logo">
    <div class="avatar" id="sidebar-av">S</div>
    <span>SkillBridge</span>
  </div>

  <div class="sidebar-section">
    <div class="sidebar-section-label">Menu Principale</div>
    <a href="/dashboard" class="nav-item active">
      <svg fill="none" viewBox="0 0 24 24" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.5" stroke="currentColor"/><rect x="14" y="3" width="7" height="7" rx="1.5" stroke="currentColor"/><rect x="3" y="14" width="7" height="7" rx="1.5" stroke="currentColor"/><rect x="14" y="14" width="7" height="7" rx="1.5" stroke="currentColor"/></svg>
      Dashboard
    </a>
    <a href="/cerca" class="nav-item">
      <svg fill="none" viewBox="0 0 24 24" stroke-width="1.8"><circle cx="11" cy="11" r="8" stroke="currentColor"/><path stroke-linecap="round" d="m21 21-4.35-4.35" stroke="currentColor"/></svg>
      Cerca
    </a>
    <a href="/mie-lezioni" class="nav-item">
      <svg fill="none" viewBox="0 0 24 24" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6.042A8.967 8.967 0 0 0 6 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 0 1 6 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 0 1 6-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0 0 18 18a8.967 8.967 0 0 0-6 2.292m0-14.25v14.25" stroke="currentColor"/></svg>
      Le Mie Lezioni
    </a>
    <a href="/messaggi" class="nav-item">
      <svg fill="none" viewBox="0 0 24 24" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12.76c0 1.6 1.123 2.994 2.707 3.227 1.068.157 2.148.279 3.238.364.466.037.893.281 1.153.671L12 21l2.652-3.978c.26-.39.687-.634 1.153-.67 1.09-.086 2.17-.208 3.238-.365 1.584-.233 2.707-1.626 2.707-3.228V6.741c0-1.602-1.123-2.995-2.707-3.228A48.394 48.394 0 0 0 12 3c-2.392 0-4.744.175-7.043.513C3.373 3.746 2.25 5.14 2.25 6.741v6.018Z" stroke="currentColor"/></svg>
      Messaggi
    </a>
  </div>

  <div class="sidebar-section">
    <div class="sidebar-section-label">Account</div>
    <a href="/profilo" class="nav-item">
      <svg fill="none" viewBox="0 0 24 24" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" stroke="currentColor"/></svg>
      Profilo
    </a>
  </div>

  <div class="sidebar-spacer"></div>

  <div class="sidebar-logout">
    <a href="/logout">
      <svg fill="none" viewBox="0 0 24 24" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M8.25 9V5.25A2.25 2.25 0 0 1 10.5 3h6a2.25 2.25 0 0 1 2.25 2.25v13.5A2.25 2.25 0 0 1 16.5 21h-6a2.25 2.25 0 0 1-2.25-2.25V15m-3 0-3-3m0 0 3-3m-3 3H15" stroke="currentColor"/></svg>
      Esci
    </a>
  </div>
</aside>

<!-- MAIN -->
<main class="main">

  <!-- Top bar -->
  <div class="top-bar">
    <div>
      <h1 id="welcome-title">Bentornato!</h1>
      <p>Scopri cosa sta succedendo nella tua community oggi.</p>
    </div>
    <div class="top-bar-actions">
      
      <button class="btn-primary" onclick="openModal()">
        <svg fill="none" viewBox="0 0 24 24" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" stroke="currentColor"/></svg>
        Crea una Lezione
      </button>
    </div>
  </div>

  <!-- Stats -->
  <div class="stats-row" id="stats-container">
    <div class="stat-card">
      <div class="stat-icon blue">
        <svg fill="none" viewBox="0 0 24 24" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6.042A8.967 8.967 0 0 0 6 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 0 1 6 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 0 1 6-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0 0 18 18a8.967 8.967 0 0 0-6 2.292m0-14.25v14.25" stroke="currentColor"/></svg>
      </div>
      <div class="stat-info">
        <label>Lezioni Frequentate</label>
        <strong id="stat-lezioni">0</strong>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon green">
        <svg fill="none" viewBox="0 0 24 24" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M16.5 18.75h-9m9 0a3 3 0 0 1 3 3h-15a3 3 0 0 1 3-3m9 0v-3.375c0-.621-.503-1.125-1.125-1.125h-.871M7.5 18.75v-3.375c0-.621.504-1.125 1.125-1.125h.872m5.007 0H9.497m5.007 0a7.454 7.454 0 0 1-.982-3.172M9.497 14.25a7.454 7.454 0 0 0 .981-3.172M5.25 4.236c-.982.143-1.954.317-2.916.52A6.003 6.003 0 0 0 7.73 9.728M5.25 4.236V4.5c0 2.108.966 3.99 2.48 5.228M5.25 4.236V2.721C7.456 2.41 9.71 2.25 12 2.25c2.291 0 4.545.16 6.75.47v1.516M7.73 9.728a6.726 6.726 0 0 0 2.748 1.35m8.272-6.842V4.5c0 2.108-.966 3.99-2.48 5.228m2.48-5.492a46.32 46.32 0 0 1 2.916.52 6.003 6.003 0 0 1-5.395 4.972m0 0a6.726 6.726 0 0 1-2.749 1.35m0 0a6.772 6.772 0 0 1-3.044 0" stroke="currentColor"/></svg>
      </div>
      <div class="stat-info">
        <label>Punti Guadagnati</label>
        <strong id="stat-punti">0</strong>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon yellow">
        <svg fill="none" viewBox="0 0 24 24" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M11.48 3.499a.562.562 0 0 1 1.04 0l2.125 5.111a.563.563 0 0 0 .475.345l5.518.442c.499.04.701.663.321.988l-4.204 3.602a.563.563 0 0 0-.182.557l1.285 5.385a.562.562 0 0 1-.84.61l-4.725-2.885a.562.562 0 0 0-.586 0L6.982 20.54a.562.562 0 0 1-.84-.61l1.285-5.386a.562.562 0 0 0-.182-.557l-4.204-3.602a.562.562 0 0 1 .321-.988l5.518-.442a.563.563 0 0 0 .475-.345L11.48 3.5Z" stroke="currentColor"/></svg>
      </div>
      <div class="stat-info">
        <label>Media Feedback</label>
        <strong id="stat-feedback">0 / 5</strong>
      </div>
    </div>
  </div>

  <!-- Content -->
  <div class="content-row">

    <!-- Lessons -->
    <div>
      <div class="section-header">
        <h2>Lezioni Consigliate</h2>
        <a href="/cerca">Vedi tutte</a>
      </div>

      <div id="lezioni-container">
        <!-- Lezioni caricate da JS -->
      </div>
    </div>

    <!-- Skills panel -->
    <div class="skills-panel">
      <h2>Le Tue Skill</h2>
      <div id="skill-container">
        <!-- Skills caricate da JS -->
      </div>
      <a href="/profilo" class="add-skill">Aggiungi un'altra competenza</a>
    </div>

  </div>

<!-- MODAL NUOVA LEZIONE -->
<div class="modal-overlay" id="modal-overlay" onclick="closeModalOutside(event)">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">&#x2715;</button>
    <h2>Nuova Lezione</h2>

    <div class="modal-field">
      <label>Titolo della Lezione</label>
      <input type="text" id="modal-titolo" placeholder="Es: Basi di React" />
    </div>

    <div class="modal-field">
      <label>Descrizione</label>
      <textarea id="modal-descrizione" placeholder="Cosa insegnerai?"></textarea>
    </div>

    <div class="modal-field">
      <label>Competenza</label>
      <select id="modal-competenza">
        <option value="">Seleziona competenza...</option>
      </select>
    </div>

    <div class="modal-row">
      <div class="modal-field">
        <label>Data</label>
        <input type="date" id="modal-data" />
      </div>
      <div class="modal-field">
        <label>Orario</label>
        <input type="time" id="modal-orario" />
      </div>
    </div>

    <div class="modal-field">
      <label>Modalità</label>
      <select id="modal-modalita">
        <option>Online</option>
        <option>Presenza</option>
        <option>Ibrida</option>
      </select>
    </div>

    <div class="modal-field">
      <label>Luogo o Link</label>
      <input type="text" id="modal-luogo" placeholder="Aula o link Meet" />
    </div>

    <button class="btn-pubblica" onclick="publishLesson()">Pubblica Lezione</button>
  </div>
</div>
</main>

<script src="/static/js/dashboard.js"></script>
<script src="/static/js/pwa_init.js"></script>
</body>
</html>
